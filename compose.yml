services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      RAWG_API_KEY: ${RAWG_API_KEY}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      FRONTEND_URL: ${FRONTEND_URL}
      NODE_ENV: development
    depends_on:
      my-little-db:
        condition: service_healthy
    volumes:
      - ./api:/app
      - /app/node_modules
      - /app/generated
    command: npm run devdb
    networks:
      - gamer-network

  my-little-db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /mydbdata
    ports:
      - "5433:5432"
    volumes:
      - my-little-db:/mydbdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gamer-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8008:8008"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
      API_INTERNAL_URL: ${API_INTERNAL_URL}
      NODE_ENV: development
      PORT: 8008
    depends_on:
      - api
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    networks:
      - gamer-network

volumes:
  my-little-db:

networks:
  gamer-network:
    driver: bridge
